# Tema visual de la web (se ve bien en móvil y escritorio).
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2b"
textColor = "#e6e6e6"
font = "sans serif"

[server]
headless = true

# Muestra el mensaje de error completo en vez del censurado por defecto
# ("redacted to prevent data leaks"). Se dejó activado a propósito: el 2026-09-14
# apareció un AttributeError en el PRIMER arranque en frío tras un despliegue que
# no se volvió a reproducir, y sin esto el mensaje real es imposible de ver (la
# traza queda dentro del iframe y la app no deja hacer scroll hasta ella).
# Lo único que expone son rutas de un repo que ya es público. Se puede quitar
# cuando la app lleve unas semanas estable.
[client]
showErrorDetails = "full"
